<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Test Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #0078D4);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            color: white;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            z-index: 0;
            animation: float 10s ease-in-out infinite;
        }
        .blob-1 { width: 300px; height: 300px; background: #0078D4; top: -60px; left: -60px; }
        .blob-2 { width: 250px; height: 250px; background: #00c6ff; bottom: -40px; right: -40px; animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(30px) scale(1.1); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 48px 40px;
            border-radius: 24px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            animation: fadeUp 0.8s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 52px;
            margin-bottom: 12px;
            display: inline-block;
            animation: bounce 2.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, #7fd4ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 15px;
            font-weight: 300;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            background: rgba(0, 200, 100, 0.15);
            border: 1px solid rgba(0, 220, 120, 0.4);
            color: #6ef7b0;
            padding: 7px 14px;
            border-radius: 50px;
            margin-bottom: 20px;
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .time-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 24px;
            color: #bfe8ff;
        }

        .btn {
            padding: 13px 32px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #0078D4, #00c6ff);
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            font-family: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 8px 20px rgba(0, 120, 212, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 120, 212, 0.55);
        }
        .btn:active { transform: translateY(0) scale(0.98); }

        footer {
            position: fixed;
            bottom: 14px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .card { padding: 36px 24px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="card">
        <span class="icon">🚀</span>
        <h1>Azure Web Test</h1>
        <p class="subtitle">Website ini berhasil berjalan di Microsoft Azure</p>

        <div class="badge"><span class="dot"></span> Server Online</div>

        <div class="time-box" id="time">Memuat waktu...</div>

        <button class="btn" onclick="showMessage()">Klik Saya ✨</button>
    </div>

    <footer>Powered by Microsoft Azure · <span id="year"></span></footer>

    <script>
        function showMessage() {
            alert("Halo! Website kamu sudah berhasil berjalan di Azure 🎉");
        }

        function updateTime() {
            const now = new Date();
            document.getElementById("time").innerText =
                "🕒 " + now.toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "medium" });
        }

        document.getElementById("year").innerText = new Date().getFullYear();
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
